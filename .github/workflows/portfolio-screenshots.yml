name: Export portfolio screenshots
on:
  push:
    paths:
      - portfolio.html
      - scripts/capture-portfolio.cjs
      - .github/workflows/portfolio-screenshots.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install screenshot browser
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Capture static sample previews
        run: node scripts/capture-portfolio.cjs
      - name: Publish image exports in public repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add portfolio-shots
          if ! git diff --cached --quiet; then
            git commit -m "Export privacy-safe portfolio screenshots"
            git push
          fi
