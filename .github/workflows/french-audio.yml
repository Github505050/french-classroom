name: Generate free French pronunciation audio
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/french-audio.yml'
jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install free offline voice engine
        run: python -m pip install 'piper-tts==1.2.0'
      - name: Download French voice model and license card
        run: |
          mkdir -p /tmp/french-voice
          BASE=https://huggingface.co/rhasspy/piper-voices/resolve/main/fr/fr_FR/siwis/medium
          curl --fail --location --retry 3 "$BASE/fr_FR-siwis-medium.onnx" -o /tmp/french-voice/fr_FR-siwis-medium.onnx
          curl --fail --location --retry 3 "$BASE/fr_FR-siwis-medium.onnx.json" -o /tmp/french-voice/fr_FR-siwis-medium.onnx.json
          curl --fail --location --retry 3 "$BASE/MODEL_CARD" -o /tmp/french-voice/MODEL_CARD
      - name: Generate reusable recordings from lesson content
        run: python scripts/build_french_audio.py --model /tmp/french-voice/fr_FR-siwis-medium.onnx
      - name: Publish audio to GitHub Pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add audio/manifest.json audio/clips/
          if ! git diff --cached --quiet; then
            git commit -m "Generate French pronunciation clips with free Piper voice"
            git push
          fi
